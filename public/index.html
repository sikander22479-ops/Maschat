<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maschat Video Meeting</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #007bff;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
    #room-selection {
      padding: 20px;
      text-align: center;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin: 20px;
      border-radius: 8px;
    }
    input {
      padding: 10px;
      font-size: 16px;
      width: 60%;
      max-width: 300px;
      margin-right: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #0056b3; }
    #video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      padding: 20px;
      flex-grow: 1;
      overflow-y: auto;
    }
    video {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background: black;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .controls {
      display: none;
      justify-content: center;
      gap: 15px;
      padding: 15px;
      background: white;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
    }
    .controls button {
      background-color: #dc3545;
    }
    .controls button.active {
      background-color: #28a745;
    }
  </style>
</head>
<body>

  <header>Maschat Video Meeting</header>

  <div id="room-selection">
    <h3>रूम जॉइन करें या बनाएं</h3>
    <input type="text" id="room-input" placeholder="रूम का नाम लिखें (जैसे: room123)">
    <button id="join-btn">Join Room</button>
  </div>

  <div id="video-grid"></div>

  <div class="controls" id="controls-bar">
    <button id="mic-btn" onclick="toggleAudio()">Mic Mute</button>
    <button id="video-btn" onclick="toggleVideo()">Video Off</button>
    <button id="leave-btn" onclick="location.reload()" style="background-color: #6c757d;">Leave</button>
  </div>

  <!-- Socket.io और PeerJS स्क्रिप्ट्स -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
