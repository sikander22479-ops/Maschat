name: maschat
description: "A complete unified engine for Maschat featuring WhatsApp chat, Telegram file sharing, and Zoom video meetings."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- डेटाबेस और बैकएंड इंजन (WhatsApp & Telegram स्टाइल सिंक) ---
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # --- मीडिया, वीडियो और फाइल पिकर इंजन (Telegram मीडिया शेयरिंग) ---
  file_picker: ^8.0.0
  image_picker: ^1.1.2

  # --- वीडियो मीटिंग इंजन (Zoom स्टाइल वीडियो कॉलिंग) ---
  flutter_webrtc: ^0.9.48
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true